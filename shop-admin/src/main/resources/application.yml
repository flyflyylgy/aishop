server:
  port: 8081
  servlet:
    context-path: /admin-api

spring:
  application:
    name: shop-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cloude_shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
  flyway:
    # 数据库迁移由 shop-portal 统一执行，避免双应用竞争
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          enabled: true
          min-idle: 2
          max-idle: 8
          max-active: 16
          # 空闲连接驱逐线程周期：配合 RedisKeepAliveConfig 的 PING 探活，
          # 定期清理被 Docker/WSL 静默回收的死连接
          time-between-eviction-runs: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3

# JWT 密钥：生产环境必须通过环境变量 JWT_SECRET 注入随机密钥（>= 32 字节）
shop:
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: 1440
  # CORS 允许来源（逗号分隔，生产改为真实前端域名）
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    com.cloude.shop: info
